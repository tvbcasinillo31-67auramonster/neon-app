name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir proj && base64 -d Project.txt | tar xz -C proj && cp LlmClient.kt ChatAccessibilityService.kt MascotOverlayService.kt ReplyOrchestrator.kt CommandActivity.kt AssistantBrain.kt Persona.kt Voice.kt MascotView.kt proj/app/src/main/java/com/example/neonbuddy/ && cp AndroidManifest.xml proj/app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: proj
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/app-debug.apk
